[package]
name = "taino-edit-leptos"
description = "Leptos adapter for taino-edit, the native-Rust WYSIWYG rich-text editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Render-mode neutral on purpose: the *app* (not this library) must enable
# exactly one of leptos's `csr` / `ssr` / `hydrate` features. Forcing `csr`
# here would leak into downstream feature unification and break SSR apps.
leptos = { version = "0.8.3" }
taino-edit-core = { workspace = true }
taino-edit-dom = { workspace = true }
wasm-bindgen = "0.2.121"

[dependencies.web-sys]
version = "0.3.98"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
    "Node",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "KeyboardEventInit",
    "InputEvent",
    "CompositionEvent",
    "ClipboardEvent",
    "DataTransfer",
]

[dev-dependencies]
gloo-timers = { version = "0.4.0", features = ["futures"] }
serde_json = "1.0.149"
wasm-bindgen-test = "0.3.71"

# The browser test-suite mounts the component through Leptos's CSR runtime;
# scoping the feature to wasm32 dev-builds keeps the library itself
# render-mode neutral for downstream apps (including SSR ones).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
leptos = { version = "0.8.3", features = ["csr"] }
